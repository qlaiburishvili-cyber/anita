<!doctype html>
<html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Invitation</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#ead9cc}.slider{position:relative;width:100%;height:100%}.slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.04);transition:opacity .9s ease,transform 4.2s ease}.slide.active{opacity:1;transform:scale(1)}.tap{position:absolute;inset:0;z-index:2}.dots{position:absolute;z-index:3;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:7px}.dot{width:6px;height:6px;border-radius:9px;background:#ffffff99}.dot.active{width:18px;background:#fff}</style></head><body><div class="slider"><img class="slide active" src="slide1.jpg"><img class="slide" src="slide2.jpg"><img class="slide" src="slide3.jpg"><img class="slide" src="slide4.jpg"><img class="slide" src="slide5.jpg"><img class="slide" src="slide6.jpg"><img class="slide" src="slide7.jpg"><img class="slide" src="slide8.jpg"><img class="slide" src="slide9.jpg"><img class="slide" src="slide10.jpg"><div class="tap" id="tap"></div><div class="dots" id="dots"></div></div><script>const s=[...document.querySelectorAll('.slide')],d=document.getElementById('dots');let i=0,t;for(let n=0;n<s.length;n++){let x=document.createElement('span');x.className='dot'+(n?'':' active');x.onclick=e=>{e.stopPropagation();show(n)};d.append(x)}function show(n){i=(n+s.length)%s.length;s.forEach((x,k)=>x.classList.toggle('active',k===i));[...d.children].forEach((x,k)=>x.classList.toggle('active',k===i));clearInterval(t);t=setInterval(()=>show(i+1),4200)}document.getElementById('tap').onclick=()=>show(i+1);t=setInterval(()=>show(i+1),4200);</script></body></html>
